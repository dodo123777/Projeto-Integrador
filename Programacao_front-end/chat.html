<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA - InfoHelp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./static/css/chat.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-app">
        <aside class="assistant-panel" aria-label="Painel do assistente">
            <a href="index.html" class="brand-link">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Agenda</span>
            </a>

            <div class="assistant-card">
                <div class="assistant-mark">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <h1>Chat InfoHelp</h1>
                <p>Ajuda para quebrar tarefas, organizar prioridades e retomar o foco com passos pequenos.</p>
            </div>

            <div class="prompt-panel">
                <span class="panel-label">Atalhos</span>
                <button class="prompt-chip" type="button" data-prompt="Me ajude a transformar uma tarefa grande em passos pequenos.">
                    Dividir tarefa
                </button>
                <button class="prompt-chip" type="button" data-prompt="Monte um plano de foco de 25 minutos para eu comecar agora.">
                    Plano de foco
                </button>
                <button class="prompt-chip" type="button" data-prompt="Como posso organizar minhas prioridades de hoje sem me sobrecarregar?">
                    Prioridades
                </button>
            </div>
        </aside>

        <main class="chat-shell">
            <header class="chat-header">
                <div>
                    <span class="eyebrow">Assistente de rotina</span>
                    <h2>Converse com a IA</h2>
                </div>
                <div class="header-actions">
                    <span class="status-pill"><i class="fa-solid fa-circle"></i> Online</span>
                    <button id="logoutBtn" class="logout-btn">Sair</button>
                </div>
            </header>

            <section id="chatMessages" class="chat-messages" aria-live="polite"></section>

            <form id="chatForm" class="chat-form">
                <label class="sr-only" for="messageInput">Digite sua mensagem</label>
                <textarea id="messageInput" rows="1" placeholder="Escreva uma pergunta ou cole uma tarefa para organizar..."></textarea>
                <button id="sendButton" type="submit" aria-label="Enviar mensagem">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Enviar</span>
                </button>
            </form>

            <p id="statusText" class="status-text" aria-live="polite"></p>
        </main>
    </div>

    <script src="./static/js/auth.js"></script>
    <script src="./static/js/chat.js"></script>
</body>
</html>
